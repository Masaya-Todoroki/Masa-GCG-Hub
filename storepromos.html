<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>

<link href="css/pages/home.css" rel="stylesheet"/>

<body class="gcg-promo-page">
<a aria-label="Admin Mode — open admin dashboard" class="gcg-admin-indicator" hidden="" href="admin.html" id="gcg-admin-indicator">
   Admin Mode
  </a>
<script src="js/shared-header.js"></script>
<header class="page-header">
<div class="eyebrow">
    CARD COLLECTION / STORE EVENTS
   </div>

    Store Tournament Promos

<main id="content">
<!-- Cards are generated here -->

<button class="type-button active" data-type="participation" id="participationButton" type="button">
     Participation
    </button>

     Winner
    </button>
</div>
</div>

    Masa’s GCG Hub
   </span>

<img alt="" id="viewerImage" src=""/>
</div>
<script src="js/image-extension-fallback.js">
</script>
