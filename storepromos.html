<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Store Tournament Promos</title>

    <link rel="stylesheet" href="css/storepromos.css">
</head>

<body>

    <header class="page-header">
        <h1>Store Tournament Promos</h1>

        <p class="page-description">
            Participation and winner cards from each Store Tournament season
        </p>

        <nav id="seasonButtons"
             class="season-buttons"
             aria-label="Store Tournament seasons">
            <a href="index.html"
               class="nav-button">
                Home
            </a>

            <!-- Season buttons are generated here -->
        </nav>
    </header>

    <main id="content">
        <!-- Cards are generated here -->
    </main>

    <div class="bottom-toggle-wrapper">
        <div class="bottom-toggle"
             role="group"
             aria-label="Promo card type">
            <button id="participationButton"
                    class="type-button active"
                    type="button"
                    data-type="participation">
                Participation
            </button>

            <button id="winnerButton"
                    class="type-button"
                    type="button"
                    data-type="winner">
                Winner
            </button>
        </div>
    </div>

    <div id="imageViewer"
         class="image-viewer"
         aria-hidden="true">
        <button id="viewerClose"
                class="viewer-close"
                type="button"
                aria-label="Close image">
            &times;
        </button>

        <img id="viewerImage"
             src=""
             alt="">
    </div>

    

    <script defer src="js/storepromos-app.js"></script>
</body>
</html>
