<!DOCTYPE html>
<html lang="en">
 <head>
  <link href="css/shared-header.css" rel="stylesheet"/>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Gundam Race
  </title>
  <link href="css/gundamrace.css" rel="stylesheet"/>
  <link href="images/Branding/favicon.png" rel="icon"/>
 </head>
 <body>
  <div id="app">
   <header class="race-site-header shared-site-header">
    <a aria-label="Masa's GCG Hub home" class="header-brand" href="index.html">
     <img alt="Masa's GCG Hub" class="brand-logo" src="images/Branding/logo.png"/>
    </a>
    <h1 class="race-banner-title">
     GUNDAM RACE
    </h1>
   </header>
   <section id="race">
    <div id="scenery">
     <div class="backdrop">
     </div>
     <div class="track">
     </div>
     <div class="fence">
     </div>
    </div>
    <div id="world">
     <div id="finish">
     </div>
    </div>
    <div id="raceProgress" role="progressbar" aria-label="Leading racer progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="race-progress-track">
        <div id="raceProgressFill" class="race-progress-fill"></div>
        <img id="raceProgressIcon" class="race-progress-icon" alt="GCG logo" src="images/Branding/GCG_Icon.webp" />
      </div>
      <span class="race-progress-finish" aria-hidden="true">🏁</span>
    </div>
    <aside aria-live="polite" id="livePlacements">
     <div class="liveTitle">
      🏆 Finishers &middot;
      <span id="liveCount">
       0
      </span>
     </div>
     <div class="liveList" id="liveList">
     </div>
    </aside>
    <div id="overlay">
     <div class="modal" id="modal">
      <div class="modalhead">
       <button type="button" id="closeModal" aria-label="Close popup" title="Close">×</button>
       <h2 id="modalTitle">
        Enter up to 100 Names
       </h2>
       <button id="clearNames">
        Clear List
       </button>
      </div>
      <div id="raceNamesPanel" class="race-setup-panel">
      <textarea id="names" placeholder="Masa
Amuro
Char
Suletta
Athrun" spellcheck="false"></textarea>
      </div>
      <div id="raceAvatarsPanel" class="race-setup-panel" hidden>
       <div class="race-avatar-tools">
        <button type="button" id="backToNames">← Back to Names</button>
        <button type="button" id="randomiseAll">🔀 Randomise All</button>
       </div>
       <div id="raceAvatarPlayers" class="race-avatar-players"></div>
       <div id="raceAvatarPicker" class="race-avatar-picker" hidden>
        <button type="button" id="backToAvatarPlayers">← Back to Players</button>
        <div class="race-avatar-tabs">
         <button type="button" data-race-category="Pilots" class="active">Pilots</button>
         <button type="button" data-race-category="Units">Mobile Suits</button>
        </div>
        <div id="raceAvatarGrid" class="race-avatar-grid"></div>
       </div>
      </div>
      <div class="modalfooter">
       <span id="namesCount">
        Names: 0 / 100
       </span>
       <button type="button" id="setRaceAvatars">👤 Set Avatars</button>
       <button class="primary" id="prepare">
        🏁 Prepare Race
       </button>
      </div>
      <div id="message" role="status"></div>
     </div>
    </div>
   </section>
   <footer id="toolbar">
    <button id="edit">
     👥 Players
    </button>
    <button class="primary" disabled="" id="start">
     ▶ Start Race
    </button>
    <button id="reset">
     &olarr; Reset
    </button>
    <label>
     Duration
     <input id="duration" type="number" min="1" max="3600" step="1" value="60" inputmode="numeric" aria-label="Race duration in seconds">
     <span>seconds</span>
    </label>
    <span class="grow">
    </span>
    <span id="status">
     Loading avatars&hellip;
    </span>
    <button id="placements">
     🏆 Results / Prizes
    </button>
   </footer>
  </div>
  <script defer="" src="js/gundamrace.js">
  </script>
 </body>
</html>
